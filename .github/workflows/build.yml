name: 音乐桌面 · 线上编译

on:
  push:
    branches: [ main ]
    paths:
      - 'music-desktop/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  windows-build:
    name: Windows x64 编译 + 打包
    runs-on: windows-latest
    defaults:
      run:
        working-directory: music-desktop

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 装 .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 环境信息
        run: |
          dotnet --info
          Write-Host "runner=${{ runner.os }}-${{ runner.arch }}"

      - name: 还原
        run: dotnet restore src/MusicDesktop/MusicDesktop.csproj

      - name: 编译
        run: dotnet build src/MusicDesktop/MusicDesktop.csproj -c Release --no-restore

      - name: 发布（自包含单文件）
        run: >
          dotnet publish src/MusicDesktop/MusicDesktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/win-x64

      - name: 打包
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath MusicDesktop-win-x64.zip -Force
          Get-Item MusicDesktop-win-x64.zip | Select-Object Name, Length
          Get-FileHash MusicDesktop-win-x64.zip -Algorithm SHA256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MusicDesktop-win-x64
          path: music-desktop/MusicDesktop-win-x64.zip
          if-no-files-found: error

      - name: 传到公开直链
        id: mirror
        continue-on-error: true
        shell: pwsh
        run: |
          $zip = "MusicDesktop-win-x64.zip"
          $size = (Get-Item $zip).Length
          Write-Host ("size={0:N1} MB" -f ($size / 1MB))
          $url = ""
          try {
            $url = curl.exe -sS -m 300 -F "reqtype=fileupload" -F "fileToUpload=@$zip" https://catbox.moe/user/api.php
          } catch { Write-Host "catbox 失败: $_" }
          if (-not $url -or $url -notmatch '^https?://') {
            try { $url = curl.exe -sS -m 300 -F "file=@$zip" https://0x0.st } catch { Write-Host "0x0 失败: $_" }
          }
          if ($url -match '^https?://') {
            Write-Host ("PUBLIC_URL=" + $url.Trim())
            "url=$($url.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "公开直链上传失败，产物只在 artifact 里"
          }

      - name: 发布 Release（公开直链）
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: 音乐桌面 v0.1.0 build.${{ github.run_number }}
          body: |
            自动构建于 ${{ github.sha }}
            - 产物：MusicDesktop-win-x64.zip（自包含单文件，解压即用）
            - 运行环境：Windows 10 1809+ / Windows 11 x64
          files: music-desktop/MusicDesktop-win-x64.zip
          draft: false
          prerelease: true

      - name: 结果汇总
        shell: pwsh
        run: |
          $size = (Get-Item MusicDesktop-win-x64.zip).Length
          $hash = (Get-FileHash MusicDesktop-win-x64.zip -Algorithm SHA256).Hash
          $rel  = "${{ steps.release.outputs.url }}"
          $mir  = "${{ steps.mirror.outputs.url }}"
          @(
            "## 音乐桌面 构建完成",
            "",
            ("- 产物：MusicDesktop-win-x64.zip  **{0:N1} MB**" -f ($size / 1MB)),
            ("- SHA256：``$hash``"),
            ("- 发布页：$rel"),
            ("- 镜像直链：$mir"),
            ("- 提交：``${{ github.sha }}``")
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "RELEASE=$rel MIRROR=$mir"
